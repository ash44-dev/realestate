services:
  app:
    image: node:20-alpine
    container_name: realestate-app
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    restart: unless-stopped
